    // --- Modal Functions ---
    function showModal(title) {
        modalTitle.textContent = title;
        modalResponse.innerHTML = '';
        modalLoader.style.display = 'block';
        modal.classList.remove('hidden');
    }

    function displayModalContent(htmlContent) {
        modalLoader.style.display = 'none';
        modalResponse.innerHTML = htmlContent;
    }

    function hideModal() {
        modal.classList.add('hidden');
    }

    modalCloseBtn.addEventListener('click', hideModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) hideModal();
    });

    // --- Gemini API Call ---
    async function callGemini(prompt) {
        const apiKey = ""; 
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
        const payload = { contents: [{ parts: [{ text: prompt }] }] };

        let attempts = 0;
        const maxAttempts = 5;
        while (attempts < maxAttempts) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    return candidate.content.parts[0].text;
                } else {
                    let errorText = "Não foi possível gerar conteúdo. A resposta da API estava vazia ou malformada.";
                    if (candidate?.finishReason) errorText += ` Motivo: ${candidate.finishReason}`;
                    if (result.promptFeedback?.blockReason) errorText += ` Bloqueado por: ${result.promptFeedback.blockReason}`;
                    console.error("Gemini API Error Response:", result);
                    return `<p class="text-red-600">${errorText}</p>`;
                }
            } catch (error) {
                attempts++;
                if (attempts >= maxAttempts) {
                    console.error("Erro ao chamar a API Gemini:", error);
                    return `<p class="text-red-600">Erro ao se conectar com a API Gemini. Verifique o console.</p>`;
                }
                const delay = Math.pow(2, attempts) * 100;
                await new Promise(res => setTimeout(res, delay));
            }
        }
    }

                <h2 class="text-3xl font-bold text-slate-700">${pillar.pillar}: ${module.title}</h2>
                <p class="text-slate-500 mt-1 mb-6">${pillar.description}</p>
                <div class="space-y-4">
                    ${module.topics.map(topic => `
                        <div class="border-t border-slate-200 pt-4">
                            <div class="flex items-start space-x-3">
                                <input type="checkbox" id="${topic.id}" data-topic-id="${topic.id}" class="mt-1 form-checkbox h-5 w-5 text-teal-600 rounded focus:ring-teal-500 border-slate-300" ${progress[topic.id] ? 'checked' : ''}>
                                <label for="${topic.id}" class="flex-1">
                                    <span class="font-medium text-slate-700">${topic.text}</span>
                                    <div class="text-sm text-slate-500 mt-1">${topic.refs}</div>
                                </label>
                                <button data-topic-text="${topic.text}" class="explain-btn gemini-btn font-semibold py-1 px-3 rounded-md text-sm whitespace-nowrap">✨ Explicar</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="mt-8 pt-4 border-t border-dashed border-slate-300 text-center">
                    <button data-module-title="${module.title}" class="quiz-btn gemini-btn font-bold py-2 px-6 rounded-lg">✨ Gerar Quiz do Módulo</button>
                </div>
            </section>
        `;
        addContentEventListeners();
    }
    
    function updateProgress(topicId, isChecked) {
        progress[topicId] = isChecked;
        localStorage.setItem('studyProgressV4', JSON.stringify(progress));
        renderOrUpdateCompletionChart();
    }

    function addSidebarEventListeners() {
        sidebarNav.querySelectorAll('.pillar-header').forEach((header) => {
            header.addEventListener('click', () => header.classList.toggle('active'));
        });
        
        sidebarNav.querySelectorAll('.module-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                activePillarIndex = parseInt(link.dataset.pIndex);
                activeModuleIndex = parseInt(link.dataset.mIndex);
                
                sidebarNav.querySelectorAll('.module-link, .pillar-header').forEach(el => el.classList.remove('active'));
                
                link.classList.add('active');
                const pillarHeader = link.closest('.module-links').previousElementSibling;
                pillarHeader.classList.add('active');
                
                renderModuleContent(activePillarIndex, activeModuleIndex);
            });
        });
    }

    function addContentEventListeners() {
        studyPlanContainer.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                updateProgress(e.target.dataset.topicId, e.target.checked);
            });
        });

        studyPlanContainer.querySelectorAll('.explain-btn').forEach(button => {
            button.addEventListener('click', async (e) => {
                const topicText = e.target.dataset.topicText;
                showModal(`✨ Explicando: ${topicText}`);
                const prompt = `Explique o seguinte tópico de finanças quantitativas de forma clara e concisa para um estudante: "${topicText}". Use parágrafos curtos, analogias simples e exemplos práticos, se possível. Formate a resposta em HTML simples (use <p>, <strong>, <ul>, <li>).`;
                const explanation = await callGemini(prompt);
                displayModalContent(explanation);
            });
        });

        studyPlanContainer.querySelectorAll('.quiz-btn').forEach(button => {
            button.addEventListener('click', async (e) => {
                const moduleTitle = e.target.dataset.moduleTitle;
                const moduleElement = e.target.closest('section');
                const topics = Array.from(moduleElement.querySelectorAll('.font-medium.text-slate-700')).map(span => span.textContent).join(', ');
                
                showModal(`✨ Quiz: ${moduleTitle}`);
                const prompt = `Crie um quiz com 3 perguntas de múltipla escolha (4 opções de 'a' a 'd') sobre os seguintes tópicos do módulo "${moduleTitle}": ${topics}. Após cada pergunta, indique a resposta correta e uma justificativa concisa em negrito. Formate como HTML (use <p>, <strong>, <ul>, <li>).`;
                const quiz = await callGemini(prompt);
                displayModalContent(quiz);
            });
        });
    }

    function renderOverviewChart() {
         if (overviewChartInstance) overviewChartInstance.destroy();
         const labels = studyPlanData.map(p => p.pillar);
         const data = studyPlanData.map(p => p.modules.reduce((acc, mod) => acc + mod.topics.length, 0));

        overviewChartInstance = new Chart(overviewChartCtx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Tópicos',
                    data: data,
                    backgroundColor: ['#008080', '#4682B4', '#5F9EA0', '#3CB371', '#87CEEB', '#6495ED', '#20B2AA'],
                    borderColor: '#ffffff',
                    borderWidth: 4,
                    hoverOffset: 8
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${c.label}: ${c.raw} tópicos` } } }, cutout: '60%' }
        });
    }

    function renderOrUpdateCompletionChart() {
        if (completionChartInstance) completionChartInstance.destroy();
        const labels = studyPlanData.map(p => p.pillar);
        const completionData = studyPlanData.map(pillar => {
            const allTopics = pillar.modules.flatMap(m => m.topics);
            if (allTopics.length === 0) return 0;
            const completedTopics = allTopics.filter(t => progress[t.id]).length;
            return (completedTopics / allTopics.length) * 100;
        });

        completionChartInstance = new Chart(completionChartCtx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Progresso (%)',
                    data: completionData,
                    backgroundColor: 'rgba(0, 128, 128, 0.6)',
                    borderColor: 'rgba(0, 128, 128, 1)',
                    borderWidth: 1
                }]
            },
            options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, max: 100, ticks: { callback: (v) => v + '%' } } }, plugins: { legend: { display: false } } }
        });
    }

    // Initial Load
    renderSidebar();
    renderModuleContent(activePillarIndex, activeModuleIndex);
    renderOverviewChart();
    renderOrUpdateCompletionChart();
});
</script>
</body>
</html>
